name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Extract version and prepare APKs
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReFit-v${VERSION}.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReFit-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReFit-debug-apk
          path: |
            app/build/outputs/apk/debug/ReFit-v${{ env.APP_VERSION }}.apk
            app/build/outputs/apk/debug/ReFit-debug.apk
          retention-days: 30

      - name: Publish Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "ReFit v${{ env.APP_VERSION }}"
          body: |
            ### 🏃 ReFit v${{ env.APP_VERSION }} — Автоматическая сборка APK
            Сборка коммита `${{ github.sha }}`.
            
            Скачайте **`ReFit-v${{ env.APP_VERSION }}.apk`** ниже и установите на Android-смартфон.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ReFit-v${{ env.APP_VERSION }}.apk
            app/build/outputs/apk/debug/ReFit-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
